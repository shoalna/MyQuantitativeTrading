watchlist_insight:
  max_tokens: 4096
  max_web_searches: 3
  prompt: |
    今天是{today}。

    看看日本股市今天在涨的票，给我挑 5 只风险/收益比真的对我有利的——不是单纯看着像牛的。每只都告诉我：在哪里进场、做错了会怎样、在哪里止盈、市场到底在哪一段定价错了。

    那些显而易见、人人都已经进场的就别提了。除非你认为还应该买入它。

news_analysis:
  max_tokens: 4096
  max_web_searches: 4
  prompt: |
    今天是{today}。

    看一下 {company}（股票代码：{code}，东京证券交易所）最近一周的新闻。砍掉噪音、没意义的分析师评级、反复炒的旧标题。

    真正会改变这只票逻辑的，是哪一两件事？这件事会在 1 周、1个月内怎么演化——对应的交易是什么？

ai_decision:
  max_tokens: 2048
  prompt: |
    公司：{company}（{code}，东京证券交易所）

    以下是过去约6个月的日线 OHLCV 数据：
    ```
    {daily_csv}
    ```

    以下是同期的周线数据：
    ```
    {weekly_csv}
    ```

    读一下上面的数据，假装你不是想卖我什么东西。日线和周线都看。

    告诉我真正的买家在哪里出现、这只票一直在哪里失败、成交量在说什么 vs 价格在说什么、趋势是健康的还是快没油了。

    买、等等、还是远离——三选一。给出理由，不超过400字。
